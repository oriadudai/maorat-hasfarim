name: Build Android app

on:
  push:
    branches: [main]
    paths: ['android/**', 'server/Index.html', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Copy shared UI into the app
        run: |
          # The app scans natively, so the web scanner library is not needed.
          grep -v 'unpkg.com/html5-qrcode' server/Index.html > android/app/src/main/assets/index.html

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No KEYSTORE_B64 secret - building with a debug key"
          fi

      - name: Build APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk maorat-hasfarim.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest maorat-hasfarim.apk \
            --title "מאורת הספרים (build ${{ github.run_number }})" \
            --notes "להורדה: maorat-hasfarim.apk"
