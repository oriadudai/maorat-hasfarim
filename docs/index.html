<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>מאורת הספרים של יעל</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐉</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Secular+One&family=Rubik:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#131d29; --card:#1d2a38; --ink:#f3e7cf; --muted:#9db0bf; --line:#2d3e50; --accent:#e8743b; --gold:#f2b544; --ok:#74c493; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: Rubik, system-ui, Arial, sans-serif; color: var(--ink); min-height:100vh;
    background:
      radial-gradient(1.5px 1.5px at 12% 18%, #fff8 50%, transparent 51%),
      radial-gradient(1px 1px at 33% 8%, #fff7 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 72% 14%, #fff9 50%, transparent 51%),
      radial-gradient(1px 1px at 88% 30%, #fff6 50%, transparent 51%),
      radial-gradient(1px 1px at 55% 26%, #fff5 50%, transparent 51%),
      radial-gradient(ellipse at 50% 120%, #3a2216 0%, transparent 60%),
      linear-gradient(#0e1620, var(--bg) 40%);
    background-attachment: fixed; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 22px 16px 40px; }
  .brand { display:flex; align-items:center; gap:14px; }
  .brand svg { width:84px; height:76px; flex-shrink:0; filter: drop-shadow(0 0 12px #3fa89a44); }
  h1 { margin:0; font-family:"Secular One", Rubik, sans-serif; font-weight:400; font-size:30px; color:var(--gold); }
  .tagline { color: var(--muted); font-size: 15px; margin-top: 2px; }
  .stats { margin: 18px 0 12px; color: var(--muted); font-size: 15px; }
  .stats b { color: var(--ink); }
  .controls { display:flex; flex-wrap:wrap; gap:8px; margin-bottom: 18px; }
  input { flex: 1 1 240px; padding: 11px 14px; border:1px solid var(--line); border-radius: 12px; background:#0f1822; color:var(--ink); font: inherit; }
  input::placeholder { color:#6f8293; }
  input:focus { outline: 2px solid var(--accent); border-color: transparent; }
  .chips { display:flex; gap:6px; flex-wrap: wrap; }
  .chip { padding: 9px 14px; border-radius: 999px; border:1px solid var(--line); background: var(--card); color: var(--ink); font: inherit; font-size: 14px; cursor:pointer; }
  .chip.on { background: linear-gradient(135deg, var(--accent), #c9502a); border-color: transparent; color:#fff8ee; }
  .grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 16px; }
  .book { background: var(--card); border:1px solid var(--line); border-radius: 14px; padding: 10px; display:flex; flex-direction:column; gap:8px; }
  .cover { aspect-ratio: 2/3; width:100%; border-radius: 6px; object-fit: cover; box-shadow: 0 4px 12px #0007; background:#2a3a4b; }
  .ph { display:flex; align-items:center; justify-content:center; text-align:center; padding:12px; font-family:"Secular One", Rubik, sans-serif; font-size: 16px; line-height:1.3; color:#fff8ee; }
  .title { font-weight: 600; font-size: 15px; line-height:1.3; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .author { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .badge { align-self:flex-start; font-size:12px; padding:3px 9px; border-radius:999px; margin-top:auto; }
  .badge.yes { background:#74c4931a; color:var(--ok); border:1px solid #74c49344; }
  .badge.no { background:#f2b5441f; color:var(--gold); border:1px solid #f2b54455; }
  .msg { text-align:center; color: var(--muted); padding: 50px 10px; line-height:1.7; }
  footer { text-align:center; color:#5f7283; font-size: 13px; margin-top: 36px; }
  @media (max-width: 420px) { .grid { grid-template-columns: repeat(2, 1fr); gap: 10px; } h1 { font-size: 25px; } .brand svg { width:64px; height:58px; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <svg viewBox="0 0 120 108" aria-hidden="true">
  <!-- book pile -->
  <rect x="18" y="86" width="84" height="12" rx="2" fill="#7a4fb0"/><rect x="18" y="86" width="84" height="3" fill="#9a72cf"/>
  <rect x="26" y="75" width="70" height="11" rx="2" fill="#3b6fb3"/><rect x="26" y="75" width="70" height="3" fill="#5b8fd3"/>
  <rect x="22" y="65" width="62" height="10" rx="2" fill="#c0473a"/><rect x="22" y="65" width="62" height="3" fill="#e0675a"/>
  <!-- tail -->
  <path d="M86 62 C104 62 110 48 102 40 C98 36 92 40 96 44" fill="none" stroke="#2f8a7e" stroke-width="6" stroke-linecap="round"/>
  <path d="M94 40 l6 -6 l1 8 z" fill="#f2b544"/>
  <!-- wing -->
  <path d="M62 34 C70 12 92 10 98 20 C90 20 88 26 92 30 C84 28 80 34 84 38 C76 36 70 40 66 44 z" fill="#246b63"/>
  <!-- body -->
  <ellipse cx="62" cy="50" rx="25" ry="17" fill="#3fa89a"/>
  <ellipse cx="60" cy="55" rx="15" ry="10" fill="#c7ecd9"/>
  <!-- feet -->
  <ellipse cx="48" cy="64" rx="7" ry="4" fill="#2f8a7e"/><ellipse cx="74" cy="64" rx="7" ry="4" fill="#2f8a7e"/>
  <!-- head -->
  <circle cx="36" cy="34" r="17" fill="#3fa89a"/>
  <ellipse cx="25" cy="40" rx="9" ry="7" fill="#5cc0b1"/>
  <circle cx="21" cy="38" r="1.3" fill="#173f3a"/>
  <path d="M38 19 l3 -11 l5 12 z" fill="#f2b544"/><path d="M47 23 l7 -8 l1 11 z" fill="#f2b544"/>
  <!-- eye: sleepy, content -->
  <path d="M33 31 q5 -5 10 0" fill="none" stroke="#173f3a" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="29" cy="38" r="2.6" fill="#f08a6a" opacity=".6"/>
  <!-- tiny smoke puff -->
  <circle cx="12" cy="30" r="3" fill="#9db0bf" opacity=".5"/><circle cx="7" cy="24" r="2" fill="#9db0bf" opacity=".35"/>
</svg>
    <div><h1>מאורת הספרים של יעל</h1><div class="tagline">האוצר שלה, מוצג לראווה</div></div>
  </div>
  <div class="stats" id="stats">&nbsp;</div>
  <div class="controls">
    <input id="q" type="search" placeholder="חיפוש ספר או מחבר">
    <div class="chips" id="fAvail">
      <button class="chip on" data-v="all">הכל</button>
      <button class="chip" data-v="yes">זמינים</button>
    </div>
    <div class="chips" id="fLang">
      <button class="chip on" data-v="all">כל השפות</button>
      <button class="chip" data-v="עברית">עברית</button>
      <button class="chip" data-v="אנגלית">English</button>
    </div>
  </div>
  <div class="grid" id="grid"></div>
  <div class="msg" id="msg">הדרקון מחפש את הספרים… 🐉</div>
  <footer>🐉 מאורת הספרים</footer>
</div>
<script>
const API = 'https://script.google.com/macros/s/AKfycbxoRopCxVPJXiRedagAHt3oRqeVog9fQ0qmI8UH1lRqSYADSFKW1MVmmp9dZtGOzEZahg/exec';
let BOOKS = [], avail = 'all', lang = 'all';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const PALETTE = [['#7a4fb0','#4b2f73'],['#3b6fb3','#22426e'],['#c0473a','#7a2a22'],['#2f8a7e','#1b544d'],['#b8752a','#704518']];
function phStyle(t) { let h = 0; for (const ch of String(t)) h = (h * 31 + ch.charCodeAt(0)) >>> 0; const [a, b] = PALETTE[h % PALETTE.length]; return `background:linear-gradient(160deg,${a},${b})`; }
function coverHtml(b) {
  const ph = `<div class="cover ph" style="${phStyle(b.title)}">${esc(b.title)}</div>`;
  return b.cover ? `<img class="cover" loading="lazy" src="${esc(b.cover)}" alt="" onerror="this.outerHTML=this.dataset.ph" data-ph="${esc(ph)}">` : ph;
}
function render() {
  const q = $('q').value.trim().toLowerCase();
  let list = BOOKS.filter(b => (avail === 'all' || b.available) && (lang === 'all' || b.lang === lang)
    && (!q || [b.title, b.author].some(v => String(v || '').toLowerCase().includes(q))));
  list.sort((a, b) => String(a.title).localeCompare(String(b.title), 'he'));
  const n = BOOKS.length, free = BOOKS.filter(b => b.available).length;
  $('stats').innerHTML = `<b>${n}</b> ספרים במאורה · <b>${free}</b> זמינים להשאלה`;
  $('grid').innerHTML = list.map(b => `
    <div class="book">
      ${coverHtml(b)}
      <div class="title">${esc(b.title)}</div>
      <div class="author">${esc(b.author || '')}</div>
      <span class="badge ${b.available ? 'yes' : 'no'}">${b.available ? 'זמין' : 'מושאל'}</span>
    </div>`).join('');
  $('msg').style.display = list.length ? 'none' : 'block';
  if (!list.length) $('msg').textContent = n ? 'לא נמצאו ספרים' : 'המאורה עוד ריקה';
}
function chips(id, set) {
  $(id).addEventListener('click', e => {
    const c = e.target.closest('.chip'); if (!c) return;
    $(id).querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x === c));
    set(c.dataset.v); render();
  });
}
chips('fAvail', v => avail = v); chips('fLang', v => lang = v);
$('q').addEventListener('input', render);
fetch(API + '?api=public').then(r => r.json()).then(j => {
  if (!j.ok) throw new Error(j.error);
  BOOKS = j.result; render();
}).catch(() => { $('msg').textContent = 'לא הצלחתי לטעון את הספרים כרגע. נסו שוב מאוחר יותר.'; });
</script>
</body>
</html>
